<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobaXterm Keygen (local)</title>
<link href="./site/pure-min.css" rel="stylesheet" />
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; background: #f7f7f9; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; padding: 20px 24px 28px; border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
  h1 { font-size: 20px; text-align: center; margin: 8px 0 20px; }
  label { display: inline-block; width: 72px; font-size: 14px; }
  input, select { width: 320px; padding: 6px 8px; line-height: 1.3; }
  .row { margin-bottom: 12px; }
  button { width: 100%; margin-top: 10px; padding: 10px; font-size: 15px; cursor: pointer; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 14px; height: 62px; font-family: Consolas, monospace; font-size: 12px; padding: 8px; }
  .hint { color: #888; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <h1>MobaXterm license 生成（本地离线）</h1>

  <div class="row"><label>版本</label>
    <select id="licenseType">
      <option value="1" selected>Professional</option>
      <option value="3">Educational</option>
      <option value="4">Personal</option>
    </select>
  </div>
  <div class="row"><label>用户名</label><input id="userName" value="defaultUser"></div>
  <div class="row"><label>版本号</label><input id="versionName" value="21.0"></div>
  <div class="row"><label>用户数</label><input id="userNum" value="1" type="number" min="1"></div>

  <button class="pure-button pure-button-primary" id="gen">生成 Custom.mxtpro</button>

  <textarea id="out" readonly placeholder="生成的 license 字符串会显示在这里"></textarea>
  <div class="hint">Custom.mxtpro 放到 MobaXterm 根目录；重建 license 前先删掉旧的 Custom.mxtpro 与 MobaXterm.ini 里的 [License] 段。</div>
</div>

<script src="./site/vue.min-2.6.12.js"></script>
<script src="./site/FileSaver.min.js"></script>
<script src="./site/jszip.min.js"></script>
<script type="module">
  import { generateLicense } from './site/mobaXtermGenerater.js';

  document.getElementById('gen').addEventListener('click', () => {
    const type = parseInt(document.getElementById('licenseType').value, 10);
    const user = document.getElementById('userName').value.trim();
    const v = (document.getElementById('versionName').value || '21.0').trim().split('.');
    const major = parseInt(v[0], 10) || 21;
    const minor = v.length > 1 ? (parseInt(v[1], 10) || 0) : 0;
    const count = Math.max(1, parseInt(document.getElementById('userNum').value, 10) || 1);

    const lic = generateLicense(type, user, count, major, minor);
    document.getElementById('out').value = lic;

    const zip = new JSZip();
    zip.file('Pro.key', lic);
    zip.generateAsync({ type: 'blob' }).then(blob => saveAs(blob, 'Custom.mxtpro'));
  });
</script>
</body>
</html>
